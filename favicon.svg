<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="8" y1="2" x2="56" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172a4f"/>
      <stop offset=".52" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#060b18"/>
    </linearGradient>
    <radialGradient id="glow" cx="46" cy="47" r="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399" stop-opacity=".42"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura" cx="33" cy="33" r="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399" stop-opacity=".3"/>
      <stop offset=".6" stop-color="#22d3ee" stop-opacity=".1"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="8" y1="-4" x2="46" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="32" y1="1" x2="32" y2="63" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="fa" x1="17" y1="7" x2="41" y2="37" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a9f8d9"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="fb" x1="16" y1="34" x2="50" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2ee0f7"/>
      <stop offset="1" stop-color="#08789e"/>
    </linearGradient>
    <linearGradient id="seam" x1="18.1" y1="34.6" x2="37" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".12" stop-color="#ffffff" stop-opacity=".78"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="edge" x1="42" y1="6" x2="19" y2="30.4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset=".75" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.8" flood-color="#01050d" flood-opacity=".6"/>
    </filter>
  </defs>

  <!-- navy glass badge -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#glow)"/>
  <rect width="64" height="64" rx="15" fill="url(#sheen)"/>

  <!-- faceted bolt: emerald top facet · cyan bottom facet · lit seam -->
  <ellipse cx="33" cy="33" rx="26" ry="28" fill="url(#aura)"/>
  <g transform="translate(3.2 3.2) scale(.9)">
    <defs>
      <clipPath id="bolt-clip">
        <path d="M42 6 14 36 27 36 20 58 50 28 37 28Z"/>
      </clipPath>
    </defs>
    <g filter="url(#lift)">
      <path d="M42 6 14 36 37 28Z" fill="url(#fa)"/>
      <path d="M14 36 27 36 20 58 50 28 37 28Z" fill="url(#fb)"/>
      <g clip-path="url(#bolt-clip)">
        <path d="M42 6 19 30.4" stroke="url(#edge)" stroke-width="1.7" fill="none"/>
        <path d="M18.1 34.6 37 28" stroke="url(#seam)" stroke-width="1.4" fill="none"/>
      </g>
    </g>
  </g>

  <!-- edge light -->
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.35" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
</svg>
