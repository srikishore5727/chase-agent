<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're on the list — ChaseAgent</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-950:#060b16; --ink:#e8eef8; --muted:#93a4c0; --muted-dim:#64748b;
    --emerald:#34d399; --cyan:#22d3ee; --grad:linear-gradient(135deg,#34d399,#22d3ee);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--navy-950); color:var(--ink);
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  .glow { position:absolute; border-radius:50%; filter:blur(120px); pointer-events:none; }
  .glow-a { width:520px; height:520px; top:-180px; left:50%; transform:translateX(-50%);
    background:radial-gradient(circle,rgba(52,211,153,.26),transparent 70%); }
  .glow-b { width:380px; height:380px; bottom:-140px; right:-100px;
    background:radial-gradient(circle,rgba(34,211,238,.18),transparent 70%); }
  .card {
    position:relative; z-index:1; text-align:center;
    background:linear-gradient(165deg,#0f1a30,#0a1120);
    border:1px solid rgba(52,211,153,.4); border-radius:22px;
    padding:52px 44px; max-width:460px; margin:0 20px;
    box-shadow:0 30px 80px rgba(0,0,0,.5), 0 0 60px rgba(52,211,153,.12);
    animation:pop .5s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop { from { opacity:0; transform:scale(.94) translateY(14px); } to { opacity:1; transform:none; } }
  .logo { display:flex; align-items:center; justify-content:center; gap:10px; font-weight:800; font-size:1.2rem; margin-bottom:26px; }
  .logo-mark { width:32px; height:32px; border-radius:9px; display:grid; place-items:center; box-shadow:0 0 24px rgba(52,211,153,.45); }
  .logo-mark img { width:100%; height:100%; display:block; border-radius:9px; }
  .logo span:not(.logo-mark) { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .check {
    width:74px; height:74px; margin:0 auto 22px; border-radius:50%;
    background:rgba(52,211,153,.14); border:2px solid rgba(52,211,153,.5);
    display:grid; place-items:center;
    box-shadow:0 0 40px rgba(52,211,153,.3);
    animation:glow 2.4s ease-in-out infinite;
  }
  @keyframes glow { 0%,100%{box-shadow:0 0 24px rgba(52,211,153,.22)} 50%{box-shadow:0 0 52px rgba(52,211,153,.45)} }
  h1 { font-size:1.7rem; font-weight:900; letter-spacing:-.03em; margin-bottom:12px; }
  h1 em { font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { color:var(--muted); line-height:1.65; font-size:.98rem; }
  p b { color:var(--ink); }
  .actions { margin-top:28px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn {
    display:inline-block; padding:13px 26px; border-radius:12px;
    font-weight:700; font-size:.95rem; text-decoration:none; transition:transform .18s, box-shadow .18s;
  }
  .btn-primary { background:var(--grad); color:#04121b; }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(52,211,153,.4); }
  .btn-ghost { color:var(--muted); border:1px solid rgba(255,255,255,.14); }
  .btn-ghost:hover { border-color:rgba(52,211,153,.5); color:var(--ink); }
  .note { font-size:.8rem; color:var(--muted-dim); margin-top:20px; }
</style>
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="card">
    <div class="logo"><span class="logo-mark"><img src="favicon.svg?v=6" alt=""></span>Chase<span>Agent</span></div>
    <div class="check">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>You're on the <em>list</em> ✅</h1>
    <p>Thanks — you'll be first to know when early access opens, with your founding <b>$5/mo</b> price locked in for life.</p>
    <div class="actions">
      <a class="btn btn-primary" href="index.html">← Back to home</a>
      <a class="btn btn-ghost" href="https://twitter.com/intent/tweet?text=I%20just%20joined%20the%20waitlist%20for%20ChaseAgent%20%E2%80%94%20a%20%245%2Fmo%20AI%20agent%20that%20chases%20invoices%20for%20small%20businesses.&url=https%3A%2F%2Fsrikishore5727.github.io%2Fchase-agent%2F" target="_blank" rel="noopener">Share on X ↗</a>
    </div>
    <p class="note">No spam. We'll only email you when it's ready.</p>
  </div>
</body>
</html>
